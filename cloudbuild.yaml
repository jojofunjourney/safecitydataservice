# cloudbuild.yaml

options:
  logging: CLOUD_LOGGING_ONLY  # Direct logs to Cloud Logging, bypassing Cloud Storage bucket requirements

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA', '.']

  # Step 2: Push the Docker image to Artifact Registry or Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA']

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'safecitydataservice'  # Replace with your Cloud Run service name
      - '--image=gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA'
      - '--region=us-west1'  # Set to the Cloud Run region
      - '--platform=managed'
      - '--allow-unauthenticated'  # Allow public access; remove if using IAM authentication
      - '--set-env-vars=ENVIRONMENT=stage,PORT=8080,GCS_BUCKET_NAME=city-crime-data,GCP_PROJECT_ID=safecitydataservice'
      - '--set-secrets=SOCRATA_APP_TOKEN=projects/$PROJECT_ID/secrets/SOCRATA_APP_TOKEN:latest'

substitutions:
  _COMMIT_SHA: '${SHORT_SHA}'

images:
  - 'gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA'
