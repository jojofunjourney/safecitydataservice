# cloudbuild.yaml

options:
  logging: CLOUD_LOGGING_ONLY  # Direct logs to Cloud Logging, bypassing Cloud Storage bucket requirements

steps:
  # Step 1: Set up buildx (required for multi-platform)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['buildx', 'create', '--use']

  # Step 2: Build and push the Docker image with buildx for the specified platform
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'buildx', 'build',
      '--platform=linux/amd64',
      '-t', 'gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA',
      '--push',
      '.'
    ]

  # Step 3: Check if the image exists before deploying (with error handling)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud container images describe gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA > /dev/null 2>&1; then
          echo "Image found. Proceeding with deployment."
          gcloud run deploy safecitydataservice \
            --image=gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA \
            --region=us-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=ENVIRONMENT=stage,GCS_BUCKET_NAME=safecitycrimedata,GCP_PROJECT_ID=safecitydataservice \
            --set-secrets=SOCRATA_APP_TOKEN=SOCRATA_APP_TOKEN:latest
        else
          echo "Warning: Image not found in registry. Skipping deployment but marking build as success."
        fi

substitutions:
  _COMMIT_SHA: '${SHORT_SHA}'

images:
  - 'gcr.io/$PROJECT_ID/safecitydataservice:$COMMIT_SHA'
